services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 1s
      timeout: 2s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
