<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimizer Pipeline Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --ground:#F4F6F8; --surface:#FFFFFF; --sunk:#EDF0F3;
    --ink:#141A21; --ink-soft:#3D4651; --muted:#69727E;
    --line:#DCE1E7; --line-strong:#C3CBD4; --grid:#E3E8ED;
    --accent:#0E7C86; --accent-soft:#D7EDEF;
    --pass:#2D7D4F; --halt:#9A6B00; --reject:#B03A48; --idle:#8892A0; --live:#0E7C86;
    --font-ui:"Archivo","Segoe UI",system-ui,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground:#0D1117; --surface:#161B22; --sunk:#11161D;
      --ink:#DDE3EA; --ink-soft:#AEB8C4; --muted:#7C8794;
      --line:#262D36; --line-strong:#39424D; --grid:#171D25;
      --accent:#3FB5BF; --accent-soft:#10333A;
      --pass:#4FA97A; --halt:#C79A2E; --reject:#D1687A; --idle:#69727E; --live:#3FB5BF;
    }
  }
  :root[data-theme="dark"] {
    --ground:#0D1117; --surface:#161B22; --sunk:#11161D;
    --ink:#DDE3EA; --ink-soft:#AEB8C4; --muted:#7C8794;
    --line:#262D36; --line-strong:#39424D; --grid:#171D25;
    --accent:#3FB5BF; --accent-soft:#10333A;
    --pass:#4FA97A; --halt:#C79A2E; --reject:#D1687A; --idle:#69727E; --live:#3FB5BF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  .rail{display:flex;align-items:center;gap:16px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
  .rail__id{font-family:var(--font-mono);font-weight:700;font-size:14px;letter-spacing:-.01em}
  .rail__id span{color:var(--accent)}
  .rail__status{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
  .dot.running{background:var(--live);animation:pulse 1.1s ease-in-out infinite}
  .dot.done{background:var(--pass)} .dot.halted{background:var(--halt)}
  .dot.stopped,.dot.error{background:var(--reject)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
  .rail__tools{margin-left:auto;display:flex;gap:8px}
  .btn{font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer}
  .btn:hover{border-color:var(--line-strong);color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btn--go{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn--go:hover{color:#fff;filter:brightness(1.08)}
  .btn--go:disabled{opacity:.45;cursor:not-allowed;filter:none}

  .shell{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 52px);min-height:520px}

  .side{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px 16px 28px}
  .side h2{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .side h2+h2{margin-top:22px}
  .f{display:grid;gap:3px;margin-bottom:9px}
  .f label{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .f input,.f select{font-family:var(--font-mono);font-size:12px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%}
  .f input:focus,.f select:focus{outline:none;border-color:var(--accent)}
  .f--row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pick{display:grid;grid-template-columns:1fr auto;gap:6px}
  .pick .btn{padding:6px 9px;font-size:11px;white-space:nowrap}
  .hintline{margin:-4px 0 9px;font-size:11px;color:var(--muted);line-height:1.4}

  .crit{border:1px solid var(--line);border-radius:3px;padding:8px;margin-bottom:7px;background:var(--ground)}
  .crit__top{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
  .crit__rank{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:2px}
  .crit__x{background:none;border:1px solid var(--line);border-radius:2px;color:var(--muted);font-size:13px;line-height:1;padding:2px 7px;cursor:pointer}
  .crit__x:hover{color:var(--reject);border-color:var(--reject)}
  .crit__g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .crit input,.crit select{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:5px 7px;width:100%}
  .crit input:focus,.crit select:focus{outline:none;border-color:var(--accent)}
  .crit label{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}

  .modal{position:fixed;inset:0;background:rgb(10 14 20/.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal__box{background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;width:min(560px,100%);max-height:78vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgb(10 14 20/.3)}
  .modal__h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .modal__h b{font-size:13px}
  .modal__p{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding:8px 15px;border-bottom:1px solid var(--line);word-break:break-all}
  .modal__l{overflow-y:auto;flex:1}
  .dir{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 15px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-family:var(--font-mono);font-size:12px}
  .dir:hover{background:var(--sunk)}
  .dir__i{color:var(--muted);font-size:11px}
  .dir__tag{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pass);background:color-mix(in srgb,var(--pass) 13%,transparent);padding:2px 5px;border-radius:2px}
  .modal__f{display:flex;gap:8px;padding:11px 15px;border-top:1px solid var(--line)}
  .modal__f .btn{flex:1}

  .chk{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--ink-soft);margin:4px 0 12px}
  .chk input{margin-top:2px;flex:none;accent-color:var(--accent)}
  .chk small{display:block;color:var(--muted);font-size:11px;line-height:1.35}
  .compose-only{display:none} body.compose .compose-only{display:grid}
  body.compose .chk.compose-only{display:flex}
  /* The legacy command is genuinely unused under docker_compose: A1 overwrites
     `command_id` with the evaluation's id, and A2.31 skips it entirely when
     `request.execution` is set -- so hide it rather than invite a value that
     silently goes nowhere. */
  body.compose .legacy-only{display:none}

  .stagewrap{position:relative;overflow:hidden;background-color:var(--ground);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;cursor:grab;touch-action:none}
  .stagewrap.is-panning{cursor:grabbing}
  .vp{position:absolute;inset:0;transform-origin:0 0}
  .edges{position:absolute;top:0;left:0;width:6000px;height:3000px;pointer-events:none;overflow:visible}

  .grp{position:absolute;width:250px;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;box-shadow:0 1px 2px rgb(20 26 33/.06);user-select:none;touch-action:none}
  .grp.dim{opacity:.62}
  .grp.is-drag{box-shadow:0 10px 24px rgb(20 26 33/.2);z-index:6}
  .grp__bar{height:3px;border-radius:3px 3px 0 0;background:var(--st,var(--idle))}
  .grp__head{display:flex;align-items:center;gap:8px;padding:9px 11px 6px;cursor:grab}
  .grp.is-drag .grp__head{cursor:grabbing}
  .grp__code{font-family:var(--font-mono);font-weight:700;font-size:15px;letter-spacing:-.02em}
  .grp__title{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.25}
  .grp__meter{height:3px;margin:0 11px;background:var(--sunk);border-radius:2px;overflow:hidden}
  .grp__meter i{display:block;height:100%;width:0;background:var(--st,var(--idle));transition:width .25s ease}
  .grp__foot{display:flex;align-items:center;gap:9px;padding:6px 11px 9px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .grp__foot b{color:var(--ink-soft)}
  .tog{margin-left:auto;background:none;border:1px solid var(--line);border-radius:2px;color:var(--muted);font-family:var(--font-mono);font-size:9.5px;padding:2px 6px;cursor:pointer}
  .tog:hover{color:var(--ink);border-color:var(--line-strong)}
  .nolist{display:none;border-top:1px solid var(--line);max-height:290px;overflow-y:auto}
  .grp.open .nolist{display:block}
  .nd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:4px 11px;border-left:2px solid var(--st,var(--idle));cursor:pointer;font-family:var(--font-mono);font-size:10.5px}
  .nd:hover{background:var(--sunk)}
  .nd__id{font-weight:700;color:var(--ink)}
  .nd__d{font-family:var(--font-ui);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nd__r{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--st,var(--idle))}
  .nd.run{background:color-mix(in srgb,var(--live) 10%,transparent)}

  .insp{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:-8px 0 28px rgb(20 26 33/.14);display:flex;flex-direction:column;z-index:20}
  .insp__h{display:flex;align-items:flex-start;gap:10px;padding:15px 17px 11px;border-bottom:1px solid var(--line)}
  .insp__c{font-family:var(--font-mono);font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.15}
  .insp__s{font-size:12px;color:var(--muted)}
  .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-size:15px;line-height:1;padding:4px 9px;cursor:pointer}
  .x:hover{color:var(--ink)}
  .insp__b{overflow-y:auto;padding:0 17px 26px}
  .sec{margin-top:18px}
  .sec__h{display:flex;align-items:baseline;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sec__h em{font-family:var(--font-mono);font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-soft);margin-left:auto}
  .note{margin-top:10px;padding:9px 11px;border-left:2px solid var(--st,var(--idle));background:color-mix(in srgb,var(--st,var(--idle)) 8%,transparent);font-size:12.5px;color:var(--ink-soft);border-radius:0 3px 3px 0}
  .empty{margin-top:10px;font-size:12.5px;color:var(--muted);font-style:italic}
  .art{border:1px solid var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
  .art__b{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;background:var(--surface);border:0;cursor:pointer;color:var(--ink)}
  .art__b:hover{background:var(--sunk)}
  .art__n{font-family:var(--font-mono);font-size:11.5px;font-weight:700}
  .art__g{font-family:var(--font-mono);font-size:9.5px;color:var(--muted)}
  .art__j{margin:0;padding:10px 12px;border-top:1px solid var(--line);background:var(--sunk);font-family:var(--font-mono);font-size:11px;line-height:1.55;white-space:pre;overflow:auto;max-height:330px;color:var(--ink-soft)}
  .k{color:var(--accent)} .s{color:var(--pass)} .n{color:var(--halt)}
  .log{font-family:var(--font-mono);font-size:11px;color:var(--muted);max-height:190px;overflow-y:auto;margin-top:8px}
  .log div{padding:1px 0;border-bottom:1px solid var(--line)}
  .log b{color:var(--ink-soft);font-weight:700}

  .hint{position:fixed;left:306px;bottom:14px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:3px;padding:4px 8px;pointer-events:none}

  @media (max-width:880px){
    .shell{grid-template-columns:1fr;height:auto}
    .side{border-right:0;border-bottom:1px solid var(--line)}
    .stagewrap{height:auto;overflow:visible;background-image:none;cursor:default;padding:14px}
    .vp{position:static;transform:none!important;display:grid;gap:11px}
    .edges{display:none} .grp{position:static!important;width:100%}
    .insp{width:100vw} .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="rail">
  <div class="rail__id">Optimizer <span>/</span> Pipeline Console</div>
  <div class="rail__status"><span class="dot" id="dot"></span><span id="status">idle — configure a run</span></div>
  <div class="rail__tools">
    <button class="btn" id="theme" type="button">Theme</button>
    <button class="btn" id="reset" type="button">Reset layout</button>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <h2>Target</h2>
    <div class="f"><label for="repo">Repository path</label>
      <div class="pick"><input id="repo" value="fixtures/go-checkout"><button class="btn" id="browse" type="button">Browse…</button></div>
    </div>
    <div class="f"><label for="feature">Feature id</label><input id="feature" value="checkout"></div>

    <h2>Criteria</h2>
    <p class="hintline">Weight sets priority — S01 ranks strategies by each criterion's share of the total.</p>
    <div id="crits"></div>
    <button class="btn" id="addcrit" type="button" style="width:100%;margin-top:6px">+ Add criterion</button>
    <div class="f" style="margin-top:12px"><label for="guardrail">Guardrail metric</label><input id="guardrail" value="correctness"></div>

    <h2>Execution</h2>
    <div class="f"><label for="profile">Profile</label>
      <select id="profile"><option value="legacy_discovery">legacy_discovery</option><option value="docker_compose">docker_compose</option></select>
    </div>
    <div class="f legacy-only"><label for="command">Command to measure</label><input id="command" value="pytest" placeholder="pytest tests/ · go test ./... · npm test"></div>
    <div class="f compose-only"><label for="compose">Compose file</label><input id="compose" value="compose.yaml"></div>
    <div class="f compose-only"><label for="svc">Eval service</label><input id="svc" value="app"></div>
    <div class="f compose-only"><label for="evalcmd">Eval command</label><input id="evalcmd" value="/app/scripts/evaluate-checkout.sh"></div>
    <div class="f compose-only"><label for="evalmetrics">Eval metrics</label><input id="evalmetrics" value="p95_latency_ms,correctness"></div>
    <div class="f compose-only"><label for="workersec">Max worker seconds</label><input id="workersec" value="600"></div>

    <label class="chk"><input type="checkbox" id="shared">
      <span>Continue into S01 / S02<small>Rank &amp; select a strategy, then draft the plan and task list. Needs a real model.</small></span>
    </label>

    <button class="btn btn--go" id="go" type="button" style="width:100%">Run pipeline</button>
  </aside>

  <div class="stagewrap" id="stagewrap">
    <div class="vp" id="vp"><svg class="edges" id="edges" aria-hidden="true"></svg></div>
  </div>
</div>
<div class="hint">drag a header to move &middot; drag background to pan &middot; click a node for its artifacts</div>

<aside class="insp" id="insp" hidden aria-label="Inspector"></aside>

<script>
(function(){
"use strict";

var ROUTE_C={continue:"var(--pass)",clarification:"var(--halt)",approval:"var(--halt)",rejected:"var(--reject)",revision:"var(--halt)",missing:"var(--reject)"};
var LAYOUT={A1:[60,60],A2:[350,60],A3:[640,60],C0:[930,60],S01:[1220,60],S02:[1510,60],
            S03:[1220,300],S04:[1510,300],S05:[1800,300],S06:[1800,60],S07:[2090,60],
            B1:[60,470],B2:[350,470]};
var CHAIN=[["A1","A2"],["A2","A3"],["A3","C0"],["C0","S01"],["S01","S02"],["S02","S03"],
           ["S03","S04"],["S04","S05"],["S05","S06"],["S06","S07"],["B1","B2"],["B2","C0"]];

var catalog=null, groups={}, nodeState={}, stageState={}, artifacts={}, runId=null, es=null;
var pan={x:0,y:0}, openKey=null;
var vp=document.getElementById("vp"), edges=document.getElementById("edges"),
    wrap=document.getElementById("stagewrap"), insp=document.getElementById("insp");

fetch("/api/catalog").then(function(r){return r.json()}).then(function(c){
  catalog=c; render(); status("idle","idle — "+c.node_count+" nodes across "+c.stages.length+" stages");
});

/* ---------- criteria editor ---------- */
var crits=[{metric_id:"p95_latency_ms",direction:"minimize",target:"5",unit:"ms",weight:"3"},
           {metric_id:"correctness",direction:"minimize",target:"0",unit:"exit_code",weight:"1"}];
var critBox=document.getElementById("crits");

function renderCrits(){
  var total=crits.reduce(function(a,c){return a+(parseFloat(c.weight)||0)},0)||1;
  critBox.innerHTML=crits.map(function(c,i){
    var share=Math.round((parseFloat(c.weight)||0)/total*100);
    return '<div class="crit" data-i="'+i+'">'+
      '<div class="crit__top">'+
        '<span class="crit__rank">'+(i===0?"primary":"criterion "+(i+1))+' &middot; '+share+'%</span>'+
        '<span></span>'+
        (crits.length>1?'<button class="crit__x" type="button" data-del="'+i+'" aria-label="Remove criterion">&times;</button>':'<span></span>')+
      '</div>'+
      '<label>Metric id</label><input data-k="metric_id" value="'+esc(c.metric_id)+'">'+
      '<div class="crit__g" style="margin-top:6px">'+
        '<div><label>Direction</label><select data-k="direction">'+
          ["minimize","maximize","target"].map(function(d){
            return '<option'+(d===c.direction?" selected":"")+'>'+d+'</option>'}).join("")+
        '</select></div>'+
        '<div><label>Target</label><input data-k="target" value="'+esc(c.target)+'"></div>'+
      '</div>'+
      '<div class="crit__g" style="margin-top:6px">'+
        '<div><label>Unit</label><input data-k="unit" value="'+esc(c.unit)+'"></div>'+
        '<div><label>Weight</label><input data-k="weight" value="'+esc(c.weight)+'"></div>'+
      '</div></div>';
  }).join("");
  critBox.querySelectorAll(".crit").forEach(function(box){
    var i=+box.dataset.i;
    box.querySelectorAll("[data-k]").forEach(function(f){
      f.addEventListener("input",function(){
        crits[i][f.dataset.k]=f.value;
        if(f.dataset.k==="weight")renderCrits();
      });
      f.addEventListener("change",function(){crits[i][f.dataset.k]=f.value});
    });
  });
  critBox.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click",function(){crits.splice(+b.dataset.del,1);renderCrits()});
  });
}
document.getElementById("addcrit").addEventListener("click",function(){
  crits.push({metric_id:"",direction:"minimize",target:"0",unit:"",weight:"1"});
  renderCrits();
});
renderCrits();

/* ---------- directory picker ---------- */
document.getElementById("browse").addEventListener("click",function(){
  openBrowser(document.getElementById("repo").value.trim());
});
function openBrowser(start){
  var m=document.createElement("div");
  m.className="modal";
  m.innerHTML='<div class="modal__box" role="dialog" aria-label="Choose repository">'+
    '<div class="modal__h"><b>Choose a repository</b>'+
      '<button class="btn" id="mUp" type="button" style="margin-left:auto">↑ Up</button></div>'+
    '<div class="modal__p" id="mPath">…</div><div class="modal__l" id="mList"></div>'+
    '<div class="modal__f"><button class="btn" id="mCancel" type="button">Cancel</button>'+
      '<button class="btn btn--go" id="mUse" type="button">Use this folder</button></div></div>';
  document.body.appendChild(m);
  var here=null, parent=null;

  function load(p){
    fetch("/api/browse?path="+encodeURIComponent(p||""))
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.detail);return j})})
      .then(function(j){
        here=j.path; parent=j.parent;
        m.querySelector("#mPath").textContent=j.path+(j.is_repo?"  ✓ looks like a project root":"");
        m.querySelector("#mList").innerHTML=j.entries.length
          ? j.entries.map(function(e){
              return '<button class="dir" type="button" data-p="'+esc(e.path)+'">'+
                '<span class="dir__i">▸</span><span>'+esc(e.name)+'</span>'+
                (e.is_repo?'<span class="dir__tag">repo</span>':'<span></span>')+'</button>'}).join("")
          : '<div style="padding:14px 15px;color:var(--muted);font-size:12px">No sub-folders here.</div>';
        m.querySelectorAll(".dir").forEach(function(b){
          b.addEventListener("click",function(){load(b.dataset.p)});
        });
      })
      .catch(function(e){m.querySelector("#mPath").textContent="cannot open: "+e.message});
  }
  m.querySelector("#mUp").addEventListener("click",function(){if(parent)load(parent)});
  m.querySelector("#mCancel").addEventListener("click",function(){m.remove()});
  m.querySelector("#mUse").addEventListener("click",function(){
    if(here)document.getElementById("repo").value=here;
    m.remove();
  });
  m.addEventListener("click",function(e){if(e.target===m)m.remove()});
  load(start);
}

/* ---------- render ---------- */
function render(){
  catalog.stages.forEach(function(st){
    var el=document.createElement("div");
    el.className="grp"+(st.runnable?"":" dim");
    el.style.setProperty("--st","var(--idle)");
    el.innerHTML=
      '<div class="grp__bar"></div>'+
      '<div class="grp__head"><span class="grp__code">'+esc(st.stage)+'</span>'+
        '<span class="grp__title">'+esc(st.title)+'</span></div>'+
      '<div class="grp__meter"><i></i></div>'+
      '<div class="grp__foot"><span><b class="cnt">0</b>/'+st.nodes.length+'</span>'+
        '<span class="why">'+esc(st.runnable?"":st.not_runnable_reason)+'</span>'+
        '<button class="tog" type="button">nodes</button></div>'+
      '<div class="nolist"></div>';
    var list=el.querySelector(".nolist");
    st.nodes.forEach(function(n){
      var row=document.createElement("div");
      row.className="nd"; row.dataset.node=n.node_id;
      row.style.setProperty("--st","var(--idle)");
      row.innerHTML='<span class="nd__id">'+esc(n.node_id)+'</span>'+
        '<span class="nd__d">'+esc(n.description||"")+'</span><span class="nd__r">idle</span>';
      row.addEventListener("click",function(e){e.stopPropagation();openNode(st,n)});
      list.appendChild(row);
      nodeState[n.node_id]={row:row,stage:st.stage};
    });
    el.querySelector(".tog").addEventListener("click",function(e){
      e.stopPropagation(); el.classList.toggle("open"); draw();
    });
    el.querySelector(".grp__head").addEventListener("click",function(e){
      if(el.dataset.moved==="1"){el.dataset.moved="0";return}
      openStage(st);
    });
    place(el,LAYOUT[st.stage][0],LAYOUT[st.stage][1]);
    drag(el,el.querySelector(".grp__head"));
    vp.appendChild(el);
    groups[st.stage]=el;
    stageState[st.stage]={done:0,total:st.nodes.length,status:"idle"};
  });
  draw();
}
function place(el,x,y){el.dataset.x=x;el.dataset.y=y;el.style.transform="translate("+x+"px,"+y+"px)"}

function drag(el,handle){
  handle.addEventListener("pointerdown",function(e){
    if(window.matchMedia("(max-width:880px)").matches)return;
    e.stopPropagation();
    var sx=e.clientX,sy=e.clientY,ox=+el.dataset.x,oy=+el.dataset.y;
    handle.setPointerCapture(e.pointerId); el.classList.add("is-drag"); el.dataset.moved="0";
    function mv(ev){var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(Math.abs(dx)>3||Math.abs(dy)>3)el.dataset.moved="1";
      place(el,ox+dx,oy+dy); draw()}
    function up(ev){handle.releasePointerCapture(ev.pointerId);el.classList.remove("is-drag");
      handle.removeEventListener("pointermove",mv);handle.removeEventListener("pointerup",up)}
    handle.addEventListener("pointermove",mv); handle.addEventListener("pointerup",up);
  });
}
wrap.addEventListener("pointerdown",function(e){
  if(window.matchMedia("(max-width:880px)").matches)return;
  if(e.target.closest(".grp"))return;
  var sx=e.clientX,sy=e.clientY,px=pan.x,py=pan.y;
  wrap.setPointerCapture(e.pointerId); wrap.classList.add("is-panning");
  function mv(ev){pan.x=px+(ev.clientX-sx);pan.y=py+(ev.clientY-sy);
    vp.style.transform="translate("+pan.x+"px,"+pan.y+"px)"}
  function up(ev){wrap.releasePointerCapture(ev.pointerId);wrap.classList.remove("is-panning");
    wrap.removeEventListener("pointermove",mv);wrap.removeEventListener("pointerup",up)}
  wrap.addEventListener("pointermove",mv); wrap.addEventListener("pointerup",up);
});

function draw(){
  if(window.matchMedia("(max-width:880px)").matches)return;
  var out="";
  CHAIN.forEach(function(pair){
    var a=groups[pair[0]],b=groups[pair[1]];
    if(!a||!b)return;
    var ax=+a.dataset.x+a.offsetWidth, ay=+a.dataset.y+26;
    var bx=+b.dataset.x, by=+b.dataset.y+26;
    var lit=stageState[pair[1]]&&stageState[pair[1]].status!=="idle";
    var col=lit?"var(--accent)":"var(--idle)";
    var m=(ax+bx)/2;
    out+='<path d="M '+ax+' '+ay+' C '+m+' '+ay+', '+m+' '+by+', '+bx+' '+by+
      '" fill="none" stroke="'+col+'" stroke-width="1.4"'+(lit?"":' stroke-dasharray="4 4"')+'/>'+
      '<circle cx="'+bx+'" cy="'+by+'" r="2.6" fill="'+col+'"/>';
  });
  edges.innerHTML=out;
}
window.addEventListener("resize",draw);

/* ---------- run ---------- */
document.getElementById("profile").addEventListener("change",function(){
  document.body.classList.toggle("compose",this.value==="docker_compose");
});
document.getElementById("go").addEventListener("click",start);

function val(id){return document.getElementById(id).value.trim()}
function start(){
  var clean=crits.filter(function(c){return c.metric_id.trim()&&c.unit.trim()});
  if(!clean.length){status("error","add at least one criterion with a metric id and unit");return}
  // The highest-weighted criterion also fills the single-criterion fields the
  // payload's shorthand path still uses (objective wording, required-field
  // checks); A1.61 seals every entry in `criteria`.
  var primary=clean.reduce(function(a,b){
    return (parseFloat(b.weight)||0)>(parseFloat(a.weight)||0)?b:a});
  var body={
    repo_path:val("repo"), feature_id:val("feature"),
    metric:primary.metric_id, direction:primary.direction,
    target:primary.target, unit:primary.unit,
    criteria:clean.map(function(c){return {
      metric_id:c.metric_id.trim(), direction:c.direction,
      target:parseFloat(c.target)||0, unit:c.unit.trim(),
      weight:parseFloat(c.weight)||1}}),
    guardrail_metric_id:val("guardrail")||null,
    execution_profile:val("profile"),
    command_id:val("profile")==="legacy_discovery"?val("command"):null,
    run_shared_workflow:document.getElementById("shared").checked
  };
  if(val("profile")==="docker_compose"){
    body.compose_file=val("compose"); body.eval_service=val("svc");
    body.eval_command=val("evalcmd"); body.eval_metrics=val("evalmetrics");
    body.application_services=val("svc");
    body.maximum_worker_seconds=parseInt(val("workersec")||"600",10);
  }
  resetRun();
  document.getElementById("go").disabled=true;
  status("running","starting…");
  fetch("/api/runs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.detail||"failed");return j})})
    .then(function(j){runId=j.run_id; listen(j.run_id)})
    .catch(function(e){status("error",e.message); document.getElementById("go").disabled=false});
}
function resetRun(){
  artifacts={}; openKey=null; insp.hidden=true;
  if(es){es.close();es=null}
  Object.keys(nodeState).forEach(function(id){
    var s=nodeState[id]; s.row.style.setProperty("--st","var(--idle)");
    s.row.classList.remove("run"); s.row.querySelector(".nd__r").textContent="idle";
    s.route=null; s.done=false;
  });
  Object.keys(stageState).forEach(function(st){
    stageState[st]={done:0,total:stageState[st].total,status:"idle"};
    paint(st);
  });
  draw();
}
function listen(id){
  es=new EventSource("/api/runs/"+id+"/events");
  es.onmessage=function(m){handle(JSON.parse(m.data))};
  es.onerror=function(){status("error","event stream lost"); document.getElementById("go").disabled=false; if(es)es.close()};
}
function handle(ev){
  if(ev.type==="node_start"){
    var s=nodeState[ev.node_id]; if(!s)return;
    s.row.classList.add("run"); s.row.querySelector(".nd__r").textContent="running";
    s.row.style.setProperty("--st","var(--live)");
    stageState[s.stage].status="running"; paint(s.stage); draw();
    status("running",ev.node_id);
  } else if(ev.type==="node_done"){
    var s2=nodeState[ev.node_id]; if(!s2)return;
    s2.done=true; s2.route=ev.route;
    s2.row.classList.remove("run");
    s2.row.querySelector(".nd__r").textContent=ev.route;
    s2.row.style.setProperty("--st",ROUTE_C[ev.route]||"var(--pass)");
    stageState[s2.stage].done++; paint(s2.stage);
  } else if(ev.type==="node_error"){
    var s3=nodeState[ev.node_id]; if(!s3)return;
    s3.row.classList.remove("run"); s3.row.querySelector(".nd__r").textContent="error";
    s3.row.style.setProperty("--st","var(--reject)");
    stageState[s3.stage].status="error"; paint(s3.stage);
  } else if(ev.type==="artifact"){
    artifacts[ev.artifact_id]=ev;
  } else if(ev.type==="stage_done"){
    stageState[ev.stage].status=ev.ok?"done":"stopped";
    stageState[ev.stage].detail=ev.detail; paint(ev.stage); draw();
  } else if(ev.type==="run_done"){
    status(ev.status,"run "+ev.status); document.getElementById("go").disabled=false;
  } else if(ev.type==="run_error"){
    status("error",ev.error); document.getElementById("go").disabled=false;
  } else if(ev.type==="model"){
    status("running","model: "+ev.model_id);
  }
  if(openKey)refreshInspector();
}
function paint(stage){
  var el=groups[stage]; if(!el)return;
  var s=stageState[stage];
  var c=s.status==="done"?"var(--pass)":s.status==="running"?"var(--live)":
        s.status==="stopped"||s.status==="error"?"var(--reject)":"var(--idle)";
  el.style.setProperty("--st",c);
  el.querySelector(".cnt").textContent=s.done;
  el.querySelector(".grp__meter i").style.width=(s.total?(s.done/s.total*100):0)+"%";
  if(s.detail)el.querySelector(".why").textContent=s.detail;
}
function status(kind,text){
  document.getElementById("dot").className="dot "+kind;
  document.getElementById("status").textContent=text;
}

/* ---------- inspector ---------- */
function openStage(st){ openKey={kind:"stage",stage:st.stage}; refreshInspector() }
function openNode(st,n){ openKey={kind:"node",stage:st.stage,node:n.node_id}; refreshInspector() }

function refreshInspector(){
  var st=catalog.stages.filter(function(s){return s.stage===openKey.stage})[0];
  var s=stageState[openKey.stage];
  var col=s.status==="done"?"var(--pass)":s.status==="running"?"var(--live)":
          s.status==="stopped"||s.status==="error"?"var(--reject)":"var(--idle)";
  var isNode=openKey.kind==="node";
  var node=isNode?st.nodes.filter(function(n){return n.node_id===openKey.node})[0]:null;
  var title=isNode?node.node_id:st.stage;
  var sub=isNode?(node.description||st.title):st.title;

  var h='<div class="insp__h" style="--st:'+col+'"><div><div class="insp__c">'+esc(title)+'</div>'+
    '<div class="insp__s">'+esc(sub)+'</div></div>'+
    '<button class="x" id="x" type="button" aria-label="Close">×</button></div>'+
    '<div class="insp__b" style="--st:'+col+'">';

  if(!st.runnable)h+='<div class="note"><b>Not runnable from this console.</b><br>'+esc(st.not_runnable_reason)+'.</div>';
  else if(s.detail&&s.status!=="done")h+='<div class="note">'+esc(s.detail)+'</div>';

  var wanted=isNode?(node.produces||[]):st.nodes.reduce(function(a,n){return a.concat(n.produces||[])},[]);
  var mine=Object.keys(artifacts).map(function(k){return artifacts[k]})
    .filter(function(a){return wanted.indexOf(a.artifact_type)>=0});

  h+='<div class="sec"><div class="sec__h">Output artifacts<em>'+mine.length+' sealed</em></div>';
  if(!mine.length)h+='<div class="empty">'+(wanted.length?"Declared: "+esc(wanted.join(", "))+" — none sealed yet.":"This node seals no artifact.")+'</div>';
  mine.forEach(function(a){
    h+='<div class="art"><button class="art__b" type="button" data-aid="'+esc(a.artifact_id)+'">'+
       '<span class="art__g">▸</span><span class="art__n">'+esc(a.artifact_type)+'</span>'+
       '<span class="art__g">'+esc(shortD(a.content_digest))+'</span></button>'+
       '<pre class="art__j" hidden>loading…</pre></div>';
  });
  h+='</div>';

  if(!isNode){
    h+='<div class="sec"><div class="sec__h">Nodes<em>'+s.done+'/'+s.total+' ran</em></div><div class="log">';
    st.nodes.forEach(function(n){
      var ns=nodeState[n.node_id];
      h+='<div><b>'+esc(n.node_id)+'</b> — '+esc(ns&&ns.route?ns.route:(ns&&ns.done?"done":"idle"))+'</div>';
    });
    h+='</div></div>';
  }
  h+='</div>';
  insp.innerHTML=h; insp.hidden=false;
  document.getElementById("x").addEventListener("click",function(){insp.hidden=true;openKey=null});
  insp.querySelectorAll(".art__b").forEach(function(b){
    b.addEventListener("click",function(){
      var pre=b.nextElementSibling, aid=b.dataset.aid;
      if(!pre.hidden){pre.hidden=true;b.firstElementChild.textContent="▸";return}
      pre.hidden=false; b.firstElementChild.textContent="▾";
      if(pre.dataset.loaded)return;
      fetch("/api/runs/"+runId+"/artifacts/"+encodeURIComponent(aid))
        .then(function(r){return r.json()})
        .then(function(j){pre.innerHTML=hl(j.read_error?j.read_error:JSON.stringify(j.content,null,2));pre.dataset.loaded="1"})
        .catch(function(e){pre.textContent="could not load: "+e.message});
    });
  });
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!insp.hidden){insp.hidden=true;openKey=null}});

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shortD(d){return d?d.slice(0,12)+"…"+d.slice(-4):"—"}
function hl(t){return esc(t)
  .replace(/&quot;([^&]*?)&quot;(\s*:)/g,'<span class="k">&quot;$1&quot;</span>$2')
  .replace(/:\s(&quot;[^&]*?&quot;)/g,': <span class="s">$1</span>')
  .replace(/:\s(-?\d+\.?\d*|true|false|null)/g,': <span class="n">$1</span>')}

document.getElementById("reset").addEventListener("click",function(){
  pan={x:0,y:0}; vp.style.transform="translate(0px,0px)";
  Object.keys(groups).forEach(function(k){place(groups[k],LAYOUT[k][0],LAYOUT[k][1])});
  draw();
});
document.getElementById("theme").addEventListener("click",function(){
  var r=document.documentElement, now=r.getAttribute("data-theme");
  var dark=now?now==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark");
});
})();
</script>
</body>
